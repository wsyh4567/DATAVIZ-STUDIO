[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataviz-studio"
version = "0.1.0"
description = "Free & open-source zero-code data analytics platform - Power BI / Tableau alternative"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "DataViz Studio Contributors"},
]
keywords = ["data", "visualization", "analytics", "dashboard", "plotly", "dash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dash>=2.14",
    "dash-bootstrap-components>=1.5",
    "dash-ag-grid>=31.0",
    "plotly>=5.18",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "chardet>=5.0",
    "seaborn>=0.12",
    "matplotlib>=3.7",
    "requests>=2.31",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
    "kaleido>=0.2.1",
]

[tool.setuptools]
packages = ["components", "core", "pages", "services", "tests"]
